name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            artifact: windows-x64
          - os: ubuntu-latest
            platform: linux
            artifact: linux-x64
          - os: macos-latest
            platform: macos
            artifact: macos-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Enable desktop targets
        run: |
          flutter config --enable-windows-desktop
          flutter config --enable-linux-desktop
          flutter config --enable-macos-desktop

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build ${{ matrix.platform }} --release

      - name: Set version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          VERSION="${VERSION//\//-}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Package portable build
        shell: bash
        run: |
          mkdir -p dist
          case "${{ matrix.platform }}" in
            windows)
              cd build/windows/x64/runner/Release
              7z a -tzip "$GITHUB_WORKSPACE/dist/spicetify-ui-$VERSION-windows-x64.zip" .
              ;;
            linux)
              cd build/linux/x64/release/bundle
              tar czf "$GITHUB_WORKSPACE/dist/spicetify-ui-$VERSION-linux-x64.tar.gz" .
              ;;
            macos)
              cd build/macos/Build/Products/Release
              ditto -c -k --keepParent spicetify_ui.app "$GITHUB_WORKSPACE/dist/spicetify-ui-$VERSION-macos-arm64.zip"
              ;;
          esac

      - name: Build macOS disk image
        if: matrix.platform == 'macos'
        run: |
          hdiutil create -volname "Spicetify UI" -srcfolder build/macos/Build/Products/Release -ov -format UDZO "dist/spicetify-ui-$VERSION-macos-arm64.dmg"

      - name: Build Linux deb package
        if: matrix.platform == 'linux'
        run: |
          PKG="spicetify-ui_${VERSION}_amd64"
          mkdir -p "build/deb/$PKG/DEBIAN" "build/deb/$PKG/usr/lib/spicetify-ui" "build/deb/$PKG/usr/bin"
          cp -r build/linux/x64/release/bundle/. "build/deb/$PKG/usr/lib/spicetify-ui/"
          printf '%s\n' \
            "Package: spicetify-ui" \
            "Version: $VERSION" \
            "Architecture: amd64" \
            "Maintainer: Spicetify UI contributors" \
            "Description: Unofficial desktop front-end for the Spicetify CLI" \
            > "build/deb/$PKG/DEBIAN/control"
          printf '#!/bin/sh\nexec /usr/lib/spicetify-ui/spicetify_ui "$@"\n' > "build/deb/$PKG/usr/bin/spicetify-ui"
          chmod +x "build/deb/$PKG/usr/bin/spicetify-ui"
          dpkg-deb --build "build/deb/$PKG" "dist/spicetify-ui-$VERSION-linux-x64.deb"

      - name: Build Windows installer
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          APP_VERSION: ${{ env.VERSION }}
        run: |
          choco install innosetup -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\spicetify-ui.iss

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*
            installer/dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Flatten artifacts for upload
        shell: bash
        run: |
          # Artifacts may nest their files in subdirectories (the Windows
          # job uploads installer/dist/* alongside dist/*). Flatten so the
          # release step finds every file regardless of nesting.
          mkdir -p release-assets
          find dist -type f -exec mv {} release-assets/ \;
          ls -la release-assets

      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
