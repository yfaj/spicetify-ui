name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            artifact: windows-x64
          - os: ubuntu-latest
            platform: linux
            artifact: linux-x64
          - os: macos-latest
            platform: macos
            artifact: macos-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Enable desktop targets
        run: |
          flutter config --enable-windows-desktop
          flutter config --enable-linux-desktop
          flutter config --enable-macos-desktop

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build ${{ matrix.platform }} --release

      - name: Package portable build
        shell: bash
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME#v}"
          case "${{ matrix.platform }}" in
            windows)
              cd build/windows/x64/runner/Release
              7z a -tzip "$GITHUB_WORKSPACE/dist/spicetify-ui-$VERSION-windows-x64.zip" .
              ;;
            linux)
              cd build/linux/x64/release/bundle
              tar czf "$GITHUB_WORKSPACE/dist/spicetify-ui-$VERSION-linux-x64.tar.gz" .
              ;;
            macos)
              cd build/macos/Build/Products/Release
              zip -r "$GITHUB_WORKSPACE/dist/spicetify-ui-$VERSION-macos-arm64.zip" spicetify_ui.app
              ;;
          esac

      - name: Build Windows installer
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          APP_VERSION: ${{ github.ref_name }}
        run: |
          choco install innosetup -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\spicetify-ui.iss

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*
            installer/dist/*
